done", "priority": "P1", "estimate": "M", "depends_on": ["021"], "labels": ["ai", "ux", "performance"]}, {"id": "026", "title": "콘텐츠 라이브러리와 홈의 다시 읽기", "description": "사용자 결정(2026-09-26): 생성된 콘텐츠를 지우지 않고 보관하며, 홈에 '지난 이야기 다시 읽기' 진입을 둔다. 2~3주 전 콘텐츠를 우선 보여 주고, 선택하면 생성 없이(토큰 0) Reader → 퀴즈 흐름으로 이어진다. 오래된 글을 다시 읽는 복습 효과를 노린다.", "details": "backlog/026.md", "status": "done", "priority": "P1", "estimate": "M", "depends_on": ["021"], "labels": ["ux", "library", "cost"]}, {"id": "027", "title": "선생성을 Batch API 로 옮겨 50% 할인", "description": "025 의 선생성을 Anthropic Batch API 로 바꾸면 비용이 절반이 되지만, 배치는 비동기(최대 24h)라 서버(Supabase) 쪽에 제출·수거 스케줄과 결과 보관 테이블이 필요하다. 앱 쪽 선생성(025)이 안정된 뒤 검토한다.", "details": "backlog/027.md", "status": "todo", "priority": "P2", "estimate": "L", "depends_on": ["025"], "labels": ["ai", "cost", "infra"]}, {"id": "028", "title": "Story 모드 톤 개선 (40대 여성 독자)", "description": "사용자 피드백(2026-09-27): Story 가 재미없다. 현재 프롬프트는 'Narrator 가 읽는 짧은 이야기' 한 줄뿐이라 요구사항 9.1(성인용·유머·위트·약한 풍자·교훈 지양)이 반영되지 않았다. 독자를 40대 한국 여성으로 명시하고 위트·풍자·공감 소재·반전이 있는 플롯을 요구하며, 매 요청 무작위 소재로 다양성을 준다. Conversation 도 자연스러운 유머를 허용한다.", "details": "backlog/028.md", "status": "done", "priority": "P1", "estimate": "S", "depends_on": [], "labels": ["ai", "content", "ux"]}, {"id": "029", "title": "Anthropic API 키 거부 (provider_auth) — 사용자 확인 필요", "description": "2026-09-27 10:3x 부터 Edge Function 의 모든 호출(content, meaning)이 provider_auth(Anthropic 401/403)로 실패한다. 코드 변경과 무관(028 프롬프트 변경 전후 동일, meaning 도 실패). Anthropic 상태 페이지는 정상. ANTHROPIC_API_KEY 시크릿은 9/21 이후 변경 없음. 키 폐기/재발급·계정 제한 여부를 Anthropic Console 에서 확인해야 하며, 새 키는 사용자가 직접 supabase secrets set 으로 넣는다.", "details": "backlog/029.md", "status": "done", "priority": "P0", "estimate": "S", "depends_on": [], "labels": ["ai", "credentials", "blocker"]}, {"id": "030", "title": "난이도 1/2/3 을 프롬프트 기준으로 구체화", "description": "생성 요청에 난이도가 숫자(1/2/3)로만 실려 모델이 수준을 짐작해야 했다. 진단 레벨(초급/중급/고급)에 맞춰 문장 길이·어휘·관용구·유머 방식 기준을 프롬프트에 넣고, 1과 3으로 생성해 차이를 실측한다. 사용자 질문(2026-09-28)에서 발견.", "details": "b for(const [key,label] of Object.entries(statuses)){const option=document.createElement('option');option.value=key;option.textContent=label;statusFilter.append(option)}
function render(){const query=document.getElementById('search').value.trim().toLowerCase(), status=statusFilter.value, priority=document.getElementById('priority-filter').value;
 const visible=tasks.filter(t=>(!status||t.status===status)&&(!priority||t.priority===priority)&&(!query||`${t.id} ${t.title} ${t.description}`.toLowerCase().includes(query)));
 document.getElementById('visible-count').textContent=`(${visible.length})`;
 document.getElementById('tasks').innerHTML=visible.length?visible.map(t=>`<article class="box row"><div class="id">#${t.id}</div><div><div class="title">${escapeHtml(t.title)}</div><div class="desc">${escapeHtml(t.description)}</div></div><div class="meta"><span class="badge ${t.status}">${escapeHtml(statuses[t.status]||t.status)}</span><span class="muted">${escapeHtml(t.priority||'')}</span><a href="${encodeURI(t.details)}">상세 문서 ↗</a></div></article>`).join(''):'<div class="box empty">검색 조건에 맞는 작업이 없습니다.</div>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
for(const id of ['search','status-filter','priority-filter'])document.getElementById(id).addEventListener(id==='search'?'input':'change',render);render();
</script></body></html>
