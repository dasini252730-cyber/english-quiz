# Builds the debug APK on every push and attaches it to a GitHub Release, so the phone can
# install an update from the Releases page without a cable.
#
# Two repository secrets (Settings → Secrets and variables → Actions):
#   AI_ENDPOINT            the Supabase Edge Function URL (kept out of the public repository;
#                          an empty value builds an app with AI features switched off)
#   DEBUG_KEYSTORE_BASE64  base64 of the PC's ~/.android/debug.keystore, so the APK carries the
#                          same signature as the one already installed and updates in place
#                          instead of demanding an uninstall that would wipe the learning data
name: Android APK

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set: this APK will not install over the one on the phone."
          fi

      - name: Build the debug APK
        env:
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }}
        run: |
          if [ -z "$AI_ENDPOINT" ]; then
            echo "::warning::AI_ENDPOINT is not set: the APK has AI features switched off."
          fi
          ./gradlew :app:assembleDebug -PaiEndpoint="$AI_ENDPOINT" ${DEBUG_KEYSTORE:+-PdebugKeystore="$DEBUG_KEYSTORE"} --no-daemon

      - name: Name the APK after the run
        run: cp app/build/outputs/apk/debug/app-debug.apk "StoryEnglish-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StoryEnglish-build${{ github.run_number }}
          path: StoryEnglish-build${{ github.run_number }}.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StoryEnglish build ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Branch `${{ github.ref_name }}`, commit ${{ github.sha }}.
            폰에서 아래 APK를 내려받아 설치하면 기존 데이터를 유지한 채 업데이트됩니다.
          files: StoryEnglish-build${{ github.run_number }}.apk
