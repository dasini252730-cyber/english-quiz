<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>영어 학습 앱 · Backlog</title>
<style>
:root{color-scheme:dark;--bg:#10141d;--panel:#191f2b;--line:#2b3444;--muted:#9aa7ba;--text:#edf2fa;--accent:#83a7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#1b2940 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:1120px;margin:0 auto;padding:42px 22px 70px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.head h1{font-size:clamp(26px,5vw,38px);margin:5px 0}.sub,.muted{color:var(--muted)}.date{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.box{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:16px}.card{padding:17px}.card span{display:block;color:var(--muted);font-size:13px}.card strong{display:block;font-size:28px;margin-top:4px}.progress{padding:20px;margin-top:14px}.progress-top{display:flex;justify-content:space-between;gap:10px}.track{height:9px;background:#30394a;border-radius:9px;overflow:hidden;margin-top:13px}.fill{height:100%;width:0;background:linear-gradient(90deg,#7298ff,#60d6b2);border-radius:9px;transition:width .35s}
.statuses{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.pill,.badge{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;color:#d7e0ef}.todo{--tone:#97a5bc}.in_progress{--tone:#82a7ff}.review_needed{--tone:#e9c46a}.needs_human{--tone:#f49b72}.done{--tone:#60d6b2}.canceled{--tone:#e98595}.waiting{--tone:#bd9cff}.badge{border-color:color-mix(in srgb,var(--tone) 45%,var(--line));color:var(--tone);white-space:nowrap}
.list-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:32px 0 14px}.list-head h2{font-size:20px;margin:0}.filters{display:flex;flex-wrap:wrap;gap:8px}input,select{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font:inherit}input{width:min(300px,56vw)}.rows{display:grid;gap:9px}.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:start;gap:12px;padding:15px 16px}.id{color:var(--muted);font:13px ui-monospace,monospace;padding-top:3px}.title{font-weight:700}.desc{color:var(--muted);font-size:13px;margin-top:4px}.meta{display:flex;align-items:center;gap:8px}.meta a{color:var(--accent);text-decoration:none;font-size:12px}.meta a:hover{text-decoration:underline}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:700px){main{padding:28px 14px 48px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.head,.list-head{align-items:flex-start;flex-direction:column}.row{grid-template-columns:42px minmax(0,1fr)}.meta{grid-column:2;flex-wrap:wrap}input{width:100%}.filters{width:100%}.filters select{flex:1}}
</style></head><body><main>
<header class="head"><div><div class="eyebrow">English Learning MVP</div><h1>작업 진행 현황</h1><div class="sub">요구사항 기반 MVP 백로그</div></div><div class="date" id="updated"></div></header>
<section class="cards" id="cards"></section>
<section class="box progress"><div class="progress-top"><strong>전체 진행률</strong><span id="progress-label" class="muted"></span></div><div class="track"><div class="fill" id="progress-fill"></div></div><div class="statuses" id="status-pills"></div></section>
<section class="list-head"><h2>작업 목록 <span id="visible-count" class="muted"></span></h2><div class="filters"><input id="search" type="search" placeholder="ID, 제목, 설명 검색"><select id="status-filter"><option value="">모든 상태</option></select><select id="priority-filter"><option value="">모든 우선순위</option><option>P0</option><option>P1</option><option>P2</option></select></div></section>
<section class="rows" id="tasks"></section></main>
<script>
const backlog=__DATA__, tasks=backlog.tasks, statuses=backlog.statuses;
const count=s=>tasks.filter(t=>t.status===s).length;
document.getElementById('updated').textContent=`최근 갱신 ${backlog.updated_at||'날짜 미정'}`;
const done=count('done'), total=tasks.length, ratio=total?Math.round(done/total*100):0;
const cards=[['전체 작업',total],['완료',done],['진행 중',count('in_progress')],['사람 판단 필요',count('needs_human')]];
document.getElementById('cards').innerHTML=cards.map(([label,n])=>`<article class="card"><span>${label}</span><strong>${n}</strong></article>`).join('');
document.getElementById('progress-label').textContent=`${done} / ${total} · ${ratio}%`;
document.getElementById('progress-fill').style.width=`${ratio}%`;
document.getElementById('status-pills').innerHTML=Object.entries(statuses).map(([key,label])=>`<span class="pill"><b class="${key}">●</b> ${label} ${count(key)}</span>`).join('');
const statusFilter=document.getElementById('status-filter');
for(const [key,label] of Object.entries(statuses)){const option=document.createElement('option');option.value=key;option.textContent=label;statusFilter.append(option)}
function render(){const query=document.getElementById('search').value.trim().toLowerCase(), status=statusFilter.value, priority=document.getElementById('priority-filter').value;
 const visible=tasks.filter(t=>(!status||t.status===status)&&(!priority||t.priority===priority)&&(!query||`${t.id} ${t.title} ${t.description}`.toLowerCase().includes(query)));
 document.getElementById('visible-count').textContent=`(${visible.length})`;
 document.getElementById('tasks').innerHTML=visible.length?visible.map(t=>`<article class="box row"><div class="id">#${t.id}</div><div><div class="title">${escapeHtml(t.title)}</div><div class="desc">${escapeHtml(t.description)}</div></div><div class="meta"><span class="badge ${t.status}">${escapeHtml(statuses[t.status]||t.status)}</span><span class="muted">${escapeHtml(t.priority||'')}</span><a href="${encodeURI(t.details)}">상세 문서 ↗</a></div></article>`).join(''):'<div class="box empty">검색 조건에 맞는 작업이 없습니다.</div>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
for(const id of ['search','status-filter','priority-filter'])document.getElementById(id).addEventListener(id==='search'?'input':'change',render);render();
</script></body></html>
